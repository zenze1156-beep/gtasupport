    <style>
        body {
            margin: 0;

            background-color: #1a1a1a;

            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_Robbery_With_Logo_landscape.0sjdgaq91u2yn.jpg?akim=1&imdensity=1&imwidth=360');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }

        .download-container {
            background-color: rgba(26, 26, 26, 0.95);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        h2 {
            color: #d4af37;
            margin-top: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p {
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-block;
            background-color: #d4af37;
            color: #1a1a1a;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.3s ease;
            animation: glowPulse 2s infinite alternate;
            border: 2px solid #d4af37;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
            100% { box-shadow: 0 0 30px rgba(212, 175, 55, 1), 0 0 50px rgba(212, 175, 55, 0.6); }
        }

        .download-btn:hover {
            background-color: transparent;
            color: #d4af37;
        }

        .info-text {
            margin-top: 25px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
