<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA VI - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://www.rockstargames.com/VI/_next/static/media/Jason_Lucia_Rooftop_With_Logos_landscape.04l3xybfa4~6m.jpg?akim=1&imdensity=1&imwidth=3840');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }

        .login-container {
            background-color: rgba(26, 26, 26, 0.95);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            position: relative;
            z-index: 10;
        }

        h2 {
            color: #d4af37;
            margin-top: 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .login-form input {
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
            outline: none;
            /* கூகுள் சஜஷன் மற்றும் பேஸ்ட் வசதிக்காக */
            autocomplete: on;
            user-select: text;
            -webkit-user-select: text;
        }

        .login-form input:focus {
            border-color: #d4af37;
        }

        .login-form button {
            padding: 12px;
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .login-form button:hover {
            background-color: #fff;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>LOGIN</h2>
        
       <form class="login-form" onsubmit="handleLogin(event)">
    <input type="email" id="loginEmail" name="email" placeholder="Enter your Gmail ID" autocomplete="email" required>
    <input type="password" id="loginPassword" name="password" placeholder="Enter your Password" required>
    <button type="submit">LOGIN</button>
</form>
<script>
    function handleLogin(event) {
        event.preventDefault(); 
        
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value.trim();

        if (email === "" || password === "") {
            alert("Please enter both Email and Password!");
            return;
        }

        // இங்கே payment.html-க்கு பதிலாக main.html என்று மாற்றப்பட்டுள்ளது
        window.location.href = "a.html";
    }
</script>
</body>
</html>
